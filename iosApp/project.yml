name: CINEMAX
options:
  bundleIdPrefix: com.cinemax
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CINEMAX:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cinemax.app
        PRODUCT_NAME: CINEMAX
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CINEMAX
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework"
          - "$(SRCROOT)/../composeApp/build/bin/iosArm64/debugFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "CinemaxKit"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - framework: ../composeApp/build/bin/iosSimulatorArm64/debugFramework/CinemaxKit.framework
        embed: false
    scheme:
      testTargets: []
