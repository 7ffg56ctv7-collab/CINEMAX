name: iOS app build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ios-simulator-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build iPhone device framework
        run: gradle :composeApp:linkDebugFrameworkIosArm64
      - name: Build iOS Simulator framework
        run: gradle :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Generate native Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project iosApp/CINEMAX.xcodeproj \
            -scheme CINEMAX \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: |
          APP_PATH=$(find build/ios-derived/Build/Products -maxdepth 2 -name 'CINEMAX.app' -type d | head -n 1)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/CINEMAX-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CINEMAX-iOS-Simulator
          path: build/CINEMAX-iOS-Simulator.zip
          if-no-files-found: error
