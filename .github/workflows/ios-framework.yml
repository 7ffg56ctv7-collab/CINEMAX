name: iOS app build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Install icon tooling
        run: |
          brew install xcodegen librsvg
          rsvg-convert -w 1024 -h 1024 iosApp/Resources/cinemax-icon.svg > iosApp/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Build iPhone device framework
        run: gradle :composeApp:linkDebugFrameworkIosArm64
      - name: Build iOS Simulator framework
        run: gradle :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Assemble universal XCFramework
        run: |
          xcodebuild -create-xcframework \
            -framework composeApp/build/bin/iosArm64/debugFramework/CinemaxKit.framework \
            -framework composeApp/build/bin/iosSimulatorArm64/debugFramework/CinemaxKit.framework \
            -output composeApp/build/CinemaxKit.xcframework
      - name: Generate native Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project iosApp/CINEMAX.xcodeproj \
            -scheme CINEMAX \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios-simulator-derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project iosApp/CINEMAX.xcodeproj \
            -scheme CINEMAX \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build/ios-device-derived \
            CODE_SIGNING_ALLOWED=NO
      - name: Package iOS build outputs
        run: |
          SIM_APP=$(find build/ios-simulator-derived/Build/Products -maxdepth 2 -name 'CINEMAX.app' -type d | head -n 1)
          DEVICE_APP=$(find build/ios-device-derived/Build/Products -maxdepth 2 -name 'CINEMAX.app' -type d | head -n 1)
          test -n "$SIM_APP"
          test -n "$DEVICE_APP"
          ditto -c -k --sequesterRsrc --keepParent "$SIM_APP" build/CINEMAX-iOS-Simulator.zip
          ditto -c -k --sequesterRsrc --keepParent "$DEVICE_APP" build/CINEMAX-iOS-Device-Unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CINEMAX-iOS-Builds
          path: |
            build/CINEMAX-iOS-Simulator.zip
            build/CINEMAX-iOS-Device-Unsigned.zip
          if-no-files-found: error
