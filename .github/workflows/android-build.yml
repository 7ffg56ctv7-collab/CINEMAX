name: Android build

# Android builds are kept available for manual runs, but are not triggered
# by iOS-focused development commits.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Run Android unit tests
        run: gradle :composeApp:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CINEMAX-Android-Debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
